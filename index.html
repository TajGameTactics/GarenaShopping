<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire | Регистрация и Алмазы</title>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0b0f19 60%);
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ffd700;
        }

        /* Основной контейнер */
        .container {
            max-width: 1200px;
            margin: 120px auto 50px;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        /* Секция с алмазами */
        .diamonds-section {
            flex: 1;
            min-width: 300px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-left: 5px solid #ffd700;
            padding-left: 15px;
            background: linear-gradient(90deg, #ffd700, transparent);
            -webkit-background-clip: text;
            color: transparent;
        }

        .diamond-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        /* Карточки алмазов */
        .diamond-card {
            background: linear-gradient(135deg, #1a233a, #0f1424);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .diamond-card:hover {
            transform: translateY(-10px);
            border-color: #ffd700;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .diamond-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6ee7ff, #3b82f6);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            margin: 0 auto 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .amount {
            font-size: 24px;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .price {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: line-through;
            margin-bottom: 15px;
        }

        .btn-buy {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-buy:hover {
            background: #ffd700;
            color: #0b0f19;
        }

        /* Форма регистрации */
        .register-section {
            flex: 1;
            min-width: 350px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .register-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 8px;
            color: #0b0f19;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-submit:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 165, 0, 0.4);
        }

        /* Футер */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 14px;
            color: #64748b;
            margin-top: 50px;
        }

        /* Подгон под мобильные */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .nav-links a {
                display: none; /* Упрощаем мобильную версию */
            }
            .container {
                flex-direction: column;
                margin-top: 80px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FREE FIRE</div>
        <div class="nav-links">
            <a href="#">Главная</a>
            <a href="#">Алмазы</a>
            <a href="#">Новости</a>
        </div>
    </header>

    <div class="container">
        <!-- Секция покупки алмазов (демо) -->
        <div class="diamonds-section">
            <h1 class="section-title">Магазин Алмазов</h1>
            <div class="diamond-grid">
                <div class="diamond-card">
                    <div class="diamond-icon"></div>
                    <div class="amount">100 💎</div>
                    <div class="price">Бонус: 0</div>
                    <button class="btn-buy" onclick="alert('Это демо! Оплата не требуется. Зарегистрируйтесь!')">Купить</button>
                </div>
                <div class="diamond-card">
                    <div class="diamond-icon"></div>
                    <div class="amount">310 💎</div>
                    <div class="price">Бонус: 10</div>
                    <button class="btn-buy" onclick="alert('Это демо! Оплата не требуется. Зарегистрируйтесь!')">Купить</button>
                </div>
                <div class="diamond-card">
                    <div class="diamond-icon"></div>
                    <div class="amount">520 💎</div>
                    <div class="price">Бонус: 30</div>
                    <button class="btn-buy" onclick="alert('Это демо! Оплата не требуется. Зарегистрируйтесь!')">Купить</button>
                </div>
                <div class="diamond-card">
                    <div class="diamond-icon"></div>
                    <div class="amount">1060 💎</div>
                    <div class="price">Бонус: 100</div>
                    <button class="btn-buy" onclick="alert('Это демо! Оплата не требуется. Зарегистрируйтесь!')">Купить</button>
                </div>
            </div>
        </div>

        <!-- Форма регистрации -->
        <div class="register-section">
            <form class="register-form" onsubmit="event.preventDefault(); alert('Регистрация успешна! Добро пожаловать, боец!');">
                <h2>Регистрация</h2>
                <div class="input-group">
                    <label for="nickname">Игровой никнейм</label>
                    <input type="text" id="nickname" placeholder="Введите ваш ник" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Минимум 6 символов" required minlength="6">
                </div>
                <button type="submit" class="btn-submit">Создать аккаунт</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2024 FAN SITE. Это демонстрационный сайт. Не является официальным сайтом Garena Free Fire.</p>
    </footer>

</body>
</html>
